<div class="memory-drawer-backdrop" id="memory-drawer-backdrop" hidden></div>
<aside class="memory-drawer" id="memory-drawer" aria-labelledby="memory-drawer-title" aria-hidden="true" inert>
  <button type="button" class="memory-drawer-close" id="memory-drawer-close" aria-label="Close memory details">Close</button>
  <p class="eyebrow">Recalled source</p>
  <h2 id="memory-drawer-title">Incident</h2>
  <p class="memory-match-method" id="memory-match-method"></p>
  <dl class="memory-source-details">
    <dt>Report</dt><dd id="memory-source-report"></dd>
    <dt>Root cause</dt><dd id="memory-source-root"></dd>
    <dt>Fix</dt><dd id="memory-source-fix"></dd>
    <dt>What did not work</dt><dd id="memory-source-failed"></dd>
    <dt>Resolved</dt><dd id="memory-source-date"></dd>
  </dl>
  <p class="form-error" id="memory-drawer-error" role="alert" hidden></p>
</aside>
